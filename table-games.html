<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Arcade games</title><style>*{box-sizing:border-box}body{margin:0;background:#14181d;color:#e5e9ed;font:15px system-ui;text-align:center;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#a8b1bb;line-height:1.6}button{font:inherit;color:inherit;background:#252d36;border:1px solid #46515d;border-radius:5px;padding:10px 16px;cursor:pointer}button:focus-visible{outline:3px solid #92d8b4}#board{display:grid;margin:24px auto;gap:4px;width:min(440px,90vw);aspect-ratio:1}#board button{padding:0;aspect-ratio:1;position:relative}#board button.flash{background:#87d8af}#board button.disk1:after,#board button.disk2:after{content:'';position:absolute;inset:12%;border-radius:50%;background:#0a0c0e;border:2px solid #63717e}#board button.disk2:after{background:#eef2f5}#board button.legal:before{content:'';position:absolute;inset:41%;border-radius:50%;background:#87d8af}#status{min-height:48px}small{display:block;color:#8e99a4;margin-top:18px}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8632851454203675" crossorigin="anonymous"></script></head><body><h1 id="title"></h1><p id="help"></p><div id="board"></div><p id="status" role="status" aria-live="polite"></p><button id="restart">New game</button><small id="credit"></small><script src="table-games.js"></script></body></html>
